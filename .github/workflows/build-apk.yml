name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/3055a552-bolt-diy]
    paths:
      - 'ai-agent-app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-agent-app/package-lock.json

      - name: Install & build web
        working-directory: ai-agent-app
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync Capacitor
        working-directory: ai-agent-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ai-agent-app/android
        run: chmod +x gradlew
      - name: Build APK
        working-directory: ai-agent-app/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          tail -n 300 /tmp/gradle.log > apk-build-log.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f apk-build-log.txt
          git commit -m "APK build log" || true
          git push origin HEAD:arena/3055a552-bolt-diy || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-agent-apk
          path: ai-agent-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build
          name: Nexus AI Agent APK (latest)
          files: ai-agent-app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
