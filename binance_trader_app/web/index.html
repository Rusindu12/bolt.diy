<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="Trading client for the Binance Spot API: live prices, balances, market and limit orders.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Binance Trader</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">

  <meta name="theme-color" content="#0B0E11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Binance Trader">
</head>
<body>
  <!--
    Web is supported for development and for browsing prices. Keep in mind that
    browsers enforce CORS: Binance's REST endpoints answer only requests coming
    from Binance's own origins, so signed (private) calls may be blocked when the
    app runs in a browser. The Android/iOS builds have no such limitation.
    Run the Android build for real trading.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
