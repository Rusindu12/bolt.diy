# JVM arguments used by the Gradle daemon. Sized for a 7 GB CI runner as well as
# a normal developer machine (the Flutter 3.47 template suggests 8 GB, which is
# more than a standard GitHub-hosted runner has).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is required by Flutter plugins (flutter_secure_storage, ...).
android.useAndroidX=true

# The Flutter Gradle Plugin targets the classic Android DSL and the classic
# Kotlin setup; these two AGP 9 switches keep that behaviour. They are the same
# flags the Flutter 3.47 project template writes.
android.newDsl=false
android.builtInKotlin=false
