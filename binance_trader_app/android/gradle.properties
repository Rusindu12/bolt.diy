# JVM arguments used by the Gradle daemon. 4 GB is comfortable for a release
# build of a Flutter app with the AndroidX/Keystore dependencies.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX is required by Flutter plugins (flutter_secure_storage, ...).
android.useAndroidX=true

# Generates faster/leaner R classes (default for AGP 8+, kept explicit here).
android.nonTransitiveRClass=true
