// Root Gradle build file for the Android part of the Flutter app.
//
// Flutter redirects the Android build output into `build/app/...` next to the
// project root so `flutter build apk` and `flutter clean` behave predictably.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
